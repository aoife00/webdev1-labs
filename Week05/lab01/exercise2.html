<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Id Selectors</title>
  <style>
  #fuchsia{background-color: fuchsia;}
  #uppercase{text-transform: uppercase;}
  #bigwords{font-size: 200%;
  color: green;}
  </style>
</head>
<body>
    
<p>Regular document text not affected by style sheet.</p>
    
<div id="fuchsia" >This paragraph has a fuchsia CSS-defined background</div>

<div id="uppercase">This paragraph has had its text transformed to uppercase letters.</div>
    
<div id="bigwords">In this paragraph, <span>just these words</span> stand out as different.</p>
    
</body>
</html>
