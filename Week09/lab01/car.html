              <label for = "email">Email Address: </label>
              <input type="email" name="email" id="email" >
              </p>
            </div>

            More details(as much as you think we'll need!)
            </textarea>
            <button  type="submit">Send Us the Info</button> <button  type="reset">Clear the Info</button>

        <section id="image">
